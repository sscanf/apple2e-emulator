name: Build

# Builds the emulator for Linux, macOS and Windows on every push. Pushing a
# tag like v1.2.0 also publishes the packages as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Smoke tests run without a display or a sound card
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  linux:
    timeout-minutes: 15
    runs-on: ubuntu-22.04  # oldest supported, so the binary runs on newer distributions too
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libsdl2-dev libsdl2-image-dev
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Package
        run: |
          name=apple2e-emulator-${{ github.ref_name }}-linux-x86_64
          tools/package.sh "$name"
          cp build/apple2e_emulator "$name/"
          cat > "$name/INSTALL.txt" <<'TXT'
          Needs SDL2 and SDL2_image (and zenity for the file dialogs):
            Debian/Ubuntu: sudo apt install libsdl2-2.0-0 libsdl2-image-2.0-0 zenity
            Fedora:        sudo dnf install SDL2 SDL2_image zenity
          Then run ./apple2e_emulator
          TXT
          (cd "$name" && ./apple2e_emulator --headless 60 | tee ../smoke.log)
          grep -q "Disk II ROM loaded" smoke.log
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: '*.tar.gz'

  macos:
    timeout-minutes: 30
    runs-on: macos-14
    env:
      SDL_VERSION: 2.32.10
      SDL_IMAGE_VERSION: 2.8.8
      MAC_FLAGS: >-
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
        -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
    steps:
      - uses: actions/checkout@v4
      # SDL2 is linked statically, for both Intel and Apple silicon, so the
      # app needs nothing installed (Homebrew's sdl2 is a wrapper around SDL3)
      - uses: actions/cache@v4
        id: sdl
        with:
          path: deps
          key: macos-sdl-${{ env.SDL_VERSION }}-${{ env.SDL_IMAGE_VERSION }}-universal-1
      - name: Build SDL2
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b release-$SDL_VERSION https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build $MAC_FLAGS -DCMAKE_INSTALL_PREFIX=$PWD/deps \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF
          cmake --build sdl-build -j && cmake --install sdl-build
          git clone --depth 1 -b release-$SDL_IMAGE_VERSION https://github.com/libsdl-org/SDL_image.git image-src
          cmake -S image-src -B image-build $MAC_FLAGS -DCMAKE_INSTALL_PREFIX=$PWD/deps \
            -DCMAKE_PREFIX_PATH=$PWD/deps -DBUILD_SHARED_LIBS=OFF -DSDL2IMAGE_SAMPLES=OFF \
            -DSDL2IMAGE_AVIF=OFF -DSDL2IMAGE_JXL=OFF -DSDL2IMAGE_TIF=OFF -DSDL2IMAGE_WEBP=OFF
          cmake --build image-build -j && cmake --install image-build
      - name: Build
        run: |
          cmake -B build $MAC_FLAGS -DCMAKE_PREFIX_PATH=$PWD/deps
          cmake --build build -j
          lipo -archs build/apple2e_emulator
      - name: Package
        run: |
          version=${{ github.ref_name }}
          app="Apple IIe.app"
          mkdir -p "$app/Contents/MacOS"
          # In a bundle the emulator looks for its files in Contents/Resources
          tools/package.sh "$app/Contents/Resources"
          cp build/apple2e_emulator "$app/Contents/MacOS/"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Apple IIe</string>
            <key>CFBundleDisplayName</key><string>Apple IIe</string>
            <key>CFBundleIdentifier</key><string>com.github.sscanf.apple2e-emulator</string>
            <key>CFBundleExecutable</key><string>apple2e_emulator</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version#v}</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep -s - "$app"
          (cd / && "$OLDPWD/$app/Contents/MacOS/apple2e_emulator" --headless 60) | tee smoke.log
          grep -q "Disk II ROM loaded" smoke.log
          ditto -c -k --keepParent "$app" "apple2e-emulator-$version-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: '*.zip'

  windows:
    timeout-minutes: 30
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build build
      - name: Package
        run: |
          name=apple2e-emulator-${{ github.ref_name }}-windows-x86_64
          tools/package.sh "$name"
          cp build/apple2e_emulator.exe "$name/"
          # The DLLs it needs (SDL2, SDL2_image and what those load)
          ldd "$name/apple2e_emulator.exe" | awk '$3 ~ /ucrt64/ {print $3}' | xargs -I{} cp {} "$name/"
          (cd "$name" && ./apple2e_emulator.exe --headless 60 | tee ../smoke.log)
          grep -q "Disk II ROM loaded" smoke.log
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: '*.zip'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes *.tar.gz *.zip
